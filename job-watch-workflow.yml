name: job-watch
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay a few minutes at busy times)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
permissions:
  contents: write
  issues: write
concurrency:
  group: job-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check job boards
        run: node check-jobs.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save seen jobs
        run: |
          git config user.name "job-watch"
          git config user.email "job-watch@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen jobs"
          git push
